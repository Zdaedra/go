# Minimal Validation Config for KataGo (Parallel Safe Mode)
# Forces extreme memory conservation to prevent OOM when sharing GPU with Legacy Production
logDir = logs
logAllGTPCommunication = false
logSearchInfo = false

# Memory Limits
nnCacheSizeMB = 256
nnMutexPoolSize = 16384
numSearchThreads = 4
numNNServerThreadsPerModel = 1

# Search behavior (Validation limits)
maxVisits = 1000
ponderingEnabled = false
playoutDoublingAdvantage = 0.0

# Rules (Strict AGA configuration)
koRule = SITUATIONAL
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
