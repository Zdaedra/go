  }

:root[data-theme="light"] {
  --ground: #FBF8F1; --panel: #F3EDDF; --ink: #2A2118; --ink-soft: #6E6152;
  --line: #E0D6C2; --wood: #D9B25F; --wood-line: #4A3B24; --accent: #B23A2B;
  --stone-b: #1C1917; --stone-w: #F6F3EC; --chip-even: #8A7B65;
}
:root[data-theme="dark"] {
  --ground: #161210; --panel: #201A15; --ink: #E9E1D2; --ink-soft: #A2947F;
  --line: #362C22; --wood: #B08D45; --wood-line: #2B2113; --accent: #E06A50;
  --stone-b: #111010; --stone-w: #EDE8DD; --chip-even: #8A7B65;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header.top {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px;
  padding: 22px 26px 14px;
  border-bottom: 1px solid var(--line);
}
header.top h1 {
  margin: 0;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 26px; font-weight: 600; letter-spacing: 0.01em;
  text-wrap: balance;
}
header.top .stats {
  color: var(--ink-soft); font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.wrap { display: flex; min-height: 100vh; }
nav.side {
  flex: 0 0 248px;
  border-right: 1px solid var(--line);
  padding: 14px 0 40px;
  position: sticky; top: 0; align-self: flex-start;
  max-height: 100vh; overflow-y: auto;
}
nav.side .search { padding: 0 16px 10px; }
nav.side input[type="search"] {
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--ink); font: inherit; font-size: 13px;
}
nav.side input[type="search"]:focus-visible,
button:focus-visible, input[type="range"]:focus-visible, .op-link:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
nav.side h2 {
  margin: 14px 16px 4px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-soft);
}
.op-link {
  display: flex; justify-content: space-between; gap: 8px;
  width: 100%; text-align: left;
  padding: 5px 16px; border: 0; background: none; color: var(--ink);
  font: inherit; font-size: 14px; cursor: pointer;
}
.op-link:hover { background: var(--panel); }
.op-link[aria-current="true"] { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
.op-link .n { color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
.op-link .stars { color: var(--accent); letter-spacing: 0.1em; font-size: 11px; }
main {
  flex: 1; padding: 22px 26px 80px; min-width: 0;
}
main h2.op-title {
  margin: 4px 0 2px;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 23px; font-weight: 600;
}
main .op-meta { color: var(--ink-soft); font-size: 13px; margin-bottom: 18px; }
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 18px;
  font-size: 12.5px; color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 14px; margin-bottom: 20px; background: var(--panel);
}
.legend b { color: var(--accent); font-weight: 700; }
.grid {
  display: grid; gap: 22px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}
.card {
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel);
  padding: 14px 14px 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.card .cap {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-size: 13.5px;
}
.card .cap .t { font-weight: 600; }
.chip {
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}
.chip.even { background: var(--chip-even); color: var(--ground); }
.chip.bp { background: var(--stone-b); color: var(--stone-w); }
.chip.wp { background: var(--stone-w); color: var(--stone-b); border: 1px solid var(--ink-soft); }
.board-box { display: flex; justify-content: center; }
.board-box svg { width: 100%; max-width: 300px; height: auto; display: block; border-radius: 6px; }
.replay { display: flex; align-items: center; gap: 8px; }
.replay input[type="range"] { flex: 1; accent-color: var(--accent); }
.replay .mv {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
  min-width: 52px; text-align: right;
}
.conts { font-size: 12.5px; color: var(--ink-soft); }
.conts .lbl {
  display: inline-block; margin: 1px 6px 1px 0;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12.5px;
  background: var(--ground); border: 1px solid var(--line); border-radius: 5px;
  padding: 1px 6px; color: var(--ink);
}
.conts .lbl b { color: var(--accent); }
.conts button.lbl { cursor: pointer; }
.conts button.lbl:hover { border-color: var(--accent); }
.conts button.lbl .arrow { color: var(--accent); font-weight: 700; }
.card.flash { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.note { font-size: 12px; color: var(--ink-soft); }
@media (max-width: 760px) {
  .wrap { display: block; }
  nav.side { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .15s ease; }
  .card:hover { border-color: var(--ink-soft); }
}

<script>
"use strict";
const DB = JSON.parse(document.getElementById("db").textContent);
const FAMILY_RU = { tengen: "Тэнгэн", hoshi: "Хоси", takamoku: "Такамоку", territorial: "Территориальные" };
const SZ = 9, CELL = 24, PAD = 26, ORIG = PAD + 12;
const GTP_COLS = "ABCDEFGHJ";
const svgNS = "http://www.w3.org/2000/svg";

function el(name, attrs, text) {
  const n = document.createElementNS(svgNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}
function html(name, cls, text) {
  const n = document.createElement(name);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
const px = i => ORIG + i * CELL;
const colOf = c => c.charCodeAt(0) - 97, rowOf = c => c.charCodeAt(1) - 97;

// Full move sequence: numbered stones plus "floating" numbers (recaptures/ko),
// whose color is inferred from alternation.
function fullSequence(d) {
  const seq = d.moves.map(m => ({ n: m.n, color: m.color, coord: m.coord }));
  for (const f of d.floating_numbers) seq.push({ n: f.n, coord: f.coord, color: null });
  seq.sort((a, b) => a.n - b.n);
  for (let i = 0; i < seq.length; i++) {
    if (seq[i].color) continue;
    if (i > 0) seq[i].color = seq[i - 1].color === "b" ? "w" : "b";
    else if (seq.length > 1) seq[i].color = seq[i + 1].color === "b" ? "w" : "b";
    else seq[i].color = "b";
  }
  return seq;
}

// Board state after the first `upto` moves of the sequence, with captures.
function boardAt(d, seq, upto) {
  const g = Array.from({ length: SZ }, () => Array(SZ).fill(null));
  for (const c of d.setup_black) g[rowOf(c)][colOf(c)] = { color: "b" };
  for (const c of d.setup_white) g[rowOf(c)][colOf(c)] = { color: "w" };
  const groupLibs = (r, c) => {
    const color = g[r][c].color, seen = new Set(), stack = [[r, c]], stones = [];
    let libs = 0;
    while (stack.length) {
      const [y, x] = stack.pop(), key = y * SZ + x;
      if (seen.has(key)) continue;
      seen.add(key); stones.push([y, x]);
      for (const [dy, dx] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const ny = y + dy, nx = x + dx;
        if (ny < 0 || nx < 0 || ny >= SZ || nx >= SZ) continue;
        const s = g[ny][nx];
        if (!s) libs++;
        else if (s.color === color && !seen.has(ny * SZ + nx)) stack.push([ny, nx]);
      }
    }
    return { libs, stones };
  };
  for (let i = 0; i < upto && i < seq.length; i++) {
    const mv = seq[i], r = rowOf(mv.coord), c = colOf(mv.coord);
    g[r][c] = { color: mv.color, n: mv.n };
    const enemy = mv.color === "b" ? "w" : "b";
    for (const [dy, dx] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const ny = r + dy, nx = c + dx;
      if (ny < 0 || nx < 0 || ny >= SZ || nx >= SZ) continue;
      if (g[ny][nx] && g[ny][nx].color === enemy) {
        const grp = groupLibs(ny, nx);
        if (grp.libs === 0) for (const [y, x] of grp.stones) g[y][x] = null;
      }
    }
  }
  return g;
}

function drawBoard(svg, d, seq, upto) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const size = px(8) + ORIG - 24;
  svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
  svg.appendChild(el("rect", { x: 0, y: 0, width: size, height: size, fill: "var(--wood)" }));
  for (let i = 0; i < SZ; i++) {
    svg.appendChild(el("line", { x1: px(0), y1: px(i), x2: px(8), y2: px(i), stroke: "var(--wood-line)", "stroke-width": i === 0 || i === 8 ? 1.6 : 0.9 }));
    svg.appendChild(el("line", { x1: px(i), y1: px(0), x2: px(i), y2: px(8), stroke: "var(--wood-line)", "stroke-width": i === 0 || i === 8 ? 1.6 : 0.9 }));
  }
  for (const [hx, hy] of [[2,2],[6,2],[4,4],[2,6],[6,6]])
    svg.appendChild(el("circle", { cx: px(hx), cy: px(hy), r: 2.6, fill: "var(--wood-line)" }));
  for (let i = 0; i < SZ; i++) {
    const t = { "font-size": 10, fill: "var(--wood-line)", "text-anchor": "middle", "font-family": "ui-monospace, Menlo, monospace" };
    svg.appendChild(el("text", { ...t, x: px(i), y: px(0) - 16 }, GTP_COLS[i]));
    svg.appendChild(el("text", { ...t, x: px(0) - 16, y: px(i) + 3.5 }, String(SZ - i)));
  }
  const g = boardAt(d, seq, upto);
  const lastN = upto > 0 && upto <= seq.length ? seq[upto - 1].n : null;
  for (let r = 0; r < SZ; r++) for (let c = 0; c < SZ; c++) {
    const s = g[r][c];
    if (!s) continue;
    const isB = s.color === "b";
    svg.appendChild(el("circle", {
      cx: px(c), cy: px(r), r: 11,
      fill: isB ? "var(--stone-b)" : "var(--stone-w)",
      stroke: isB ? "none" : "var(--wood-line)", "stroke-width": 0.8,
    }));
    if (s.n != null) {
      const hot = s.n === lastN;
      svg.appendChild(el("text", {
        x: px(c), y: px(r) + 4, "text-anchor": "middle",
        "font-size": s.n > 99 ? 9.5 : 11, "font-weight": hot ? 800 : 600,
        "font-family": "system-ui, sans-serif",
        fill: hot ? "var(--accent)" : (isB ? "var(--stone-w)" : "var(--stone-b)"),
      }, String(s.n)));
    }
  }
  // Variation letters & markers only make sense on the final position.
  if (upto >= seq.length) {
    for (const l of d.labels) {
      const c = colOf(l.coord), r = rowOf(l.coord);
      if (!g[r][c]) svg.appendChild(el("circle", { cx: px(c), cy: px(r), r: 9.5, fill: "var(--wood)" }));
      svg.appendChild(el("text", {
        x: px(c), y: px(r) + 4.5, "text-anchor": "middle",
        "font-size": 13, "font-weight": 800, "font-family": "system-ui, sans-serif",
        fill: "var(--accent)",
      }, l.text));
    }
    for (const m of d.markers) {
      const c = colOf(m.coord), r = rowOf(m.coord);
      const s = g[r][c];
      const stroke = s && s.color === "b" ? "var(--stone-w)" : "var(--wood-line)";
      if (m.kind === "triangle")
        svg.appendChild(el("polygon", { points: `${px(c)},${px(r)-7.5} ${px(c)-6.7},${px(r)+4.5} ${px(c)+6.7},${px(r)+4.5}`, fill: "none", stroke, "stroke-width": 1.5 }));
      else if (m.kind === "square")
        svg.appendChild(el("rect", { x: px(c)-5.5, y: px(r)-5.5, width: 11, height: 11, fill: "none", stroke, "stroke-width": 1.5 }));
      else
        svg.appendChild(el("circle", { cx: px(c), cy: px(r), r: 3.4, fill: "var(--ink-soft)" }));
    }
  }
}

const RESULT_CHIP = { even: ["ровно (=)", "even"], "B+": ["B+ чёрные", "bp"], "W+": ["W+ белые", "wp"] };

// diagram id / opening slug -> location in DB
const BY_OPENING = {}, CURRENT = { fam: null, op: null };
for (const fam of DB.families)
  for (const op of fam.openings)
    BY_OPENING[fam.family + "/" + op.slug] = { fam, op };

function openingName(slug, family) {
  const hit = BY_OPENING[family + "/" + slug];
  return hit ? hit.op.name : slug;
}

function jumpTo(next) {
  const hit = BY_OPENING[next.family + "/" + next.opening];
  if (!hit) return;
  if (CURRENT.op !== hit.op) {
    renderOpening(hit.fam, hit.op);
    document.querySelectorAll(".op-link[aria-current]").forEach(x => x.removeAttribute("aria-current"));
    for (const b of document.querySelectorAll(".op-link"))
      if (b.__op === hit.op) { b.setAttribute("aria-current", "true"); break; }
  }
  const card = document.querySelector(`.card[data-id="${next.diagram}"]`);
  if (card) {
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.add("flash");
    setTimeout(() => card.classList.remove("flash"), 1600);
  }
}

function gtp(coord) { return GTP_COLS[colOf(coord)] + (SZ - rowOf(coord)); }

function renderOpening(fam, op) {
  CURRENT.fam = fam; CURRENT.op = op;
  const main = document.getElementById("main");
  main.textContent = "";
  const h = html("h2", "op-title", op.name);
  main.appendChild(h);
  const meta = html("div", "op-meta");
  const diff = op.difficulty ? "★".repeat(op.difficulty) + "☆".repeat(3 - op.difficulty) + " · " : "";
  meta.textContent = `${FAMILY_RU[fam.family] || fam.family} · ${diff}${op.diagrams.length} диагр.`;
  main.appendChild(meta);
  const legend = html("div", "legend");
  legend.innerHTML = "<span><b>A, B, C…</b> — варианты следующего хода</span>" +
    "<span>△ / □ — отмеченные пункты и камни</span>" +
    "<span>Слайдер проигрывает ходы; взятые камни снимаются</span>";
  main.appendChild(legend);
  const grid = html("div", "grid");
  main.appendChild(grid);

  for (const d of op.diagrams) {
    const seq = fullSequence(d);
    const card = html("div", "card");
    card.dataset.id = d.id;
    const cap = html("div", "cap");
    cap.appendChild(html("span", "t", d.caption || d.id));
    if (d.result && RESULT_CHIP[d.result]) {
      const [txt, cls] = RESULT_CHIP[d.result];
      cap.appendChild(html("span", "chip " + cls, txt));
    }
    card.appendChild(cap);

    const box = html("div", "board-box");
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", d.caption || d.id);
    box.appendChild(svg);
    card.appendChild(box);

    if (seq.length) {
      const replay = html("div", "replay");
      const slider = document.createElement("input");
      slider.type = "range"; slider.min = 0; slider.max = seq.length; slider.value = seq.length;
      slider.setAttribute("aria-label", "Номер хода");
      const mv = html("span", "mv");
      const upd = () => {
        const v = +slider.value;
        drawBoard(svg, d, seq, v);
        mv.textContent = v === 0 ? "старт" : `ход ${seq[v - 1].n}`;
      };
      slider.addEventListener("input", upd);
      replay.appendChild(slider); replay.appendChild(mv);
      card.appendChild(replay);
      upd();
    } else {
      drawBoard(svg, d, seq, 0);
    }

    const conts_data = d.continuations || [];
    if (conts_data.length) {
      const conts = html("div", "conts");
      conts.appendChild(document.createTextNode("Продолжения: "));
      for (const c of conts_data) {
        const mark = c.label ? `<b>${c.label}</b>` :
          (c.kind === "triangle" ? "△" : c.kind === "square" ? "□" : "·");
        if (c.next) {
          const b = html("button", "lbl");
          b.type = "button";
          const tname = openingName(c.next.opening, c.next.family);
          b.innerHTML = `${mark} ${c.gtp} <span class="arrow">→</span> ${tname}`;
          b.title = `Перейти к продолжению (${c.next.diagram})`;
          b.addEventListener("click", () => jumpTo(c.next));
          conts.appendChild(b);
        } else {
          const s = html("span", "lbl");
          s.innerHTML = `${mark} ${c.gtp}`;
          if (c.on !== "empty") s.title = "Отмеченный камень";
          conts.appendChild(s);
        }
      }
      card.appendChild(conts);
    }
    if (d.floating_numbers.length) {
      card.appendChild(html("div", "note",
        d.floating_numbers.map(f => `ход ${f.n} — в пункте ${gtp(f.coord)} (перевзятие)`).join("; ")));
    }
    grid.appendChild(card);
  }
}

function buildNav(filter) {
  const nav = document.getElementById("navlist");
  nav.textContent = "";
  const f = (filter || "").trim().toLowerCase();
  for (const fam of DB.families) {
    const ops = fam.openings.filter(o => !f || o.name.toLowerCase().includes(f));
    if (!ops.length) continue;
    nav.appendChild(html("h2", null, FAMILY_RU[fam.family] || fam.family));
    for (const op of ops) {
      const b = html("button", "op-link");
      b.type = "button";
      const left = html("span", null, op.name);
      if (op.difficulty) {
        left.appendChild(document.createTextNode(" "));
        left.appendChild(html("span", "stars", "★".repeat(op.difficulty)));
      }
      b.appendChild(left);
      b.appendChild(html("span", "n", String(op.diagrams.length)));
      b.addEventListener("click", () => {
        document.querySelectorAll(".op-link[aria-current]").forEach(x => x.removeAttribute("aria-current"));
        b.setAttribute("aria-current", "true");
        renderOpening(fam, op);
        if (window.innerWidth <= 760) document.getElementById("main").scrollIntoView({ behavior: "smooth" });
      });
      b.__op = op;
      nav.appendChild(b);
    }
  }
}

let nOps = 0, nDiag = 0, nMoves = 0;
for (const fam of DB.families) for (const op of fam.openings) {
  nOps++;
  for (const d of op.diagrams) { nDiag++; nMoves += d.moves.length; }
}
document.getElementById("stats").textContent =
  `${nOps} дебютов · ${nDiag} диаграмм · ${nMoves} ходов · доска 9×9`;

document.getElementById("q").addEventListener("input", e => buildNav(e.target.value));
buildNav("");
const first = document.querySelector(".op-link");
if (first) first.click();
</script>
